name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 테스트 · 린트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 장소 데이터 검사
        run: npm run validate:places
      - name: 테스트
        run: npm test
      - name: 린트
        run: npm run lint
      - name: 빌드
        run: npm run build
