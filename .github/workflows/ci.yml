name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 테스트 · 린트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 장소 데이터 검사
        run: npm run validate:places
      - name: 테스트
        run: npm test
      - name: 린트
        run: npm run lint
      - name: 빌드
        run: npm run build
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 화면 흐름 테스트 (E2E)
        run: npm run test:e2e
      - name: E2E 결과 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
