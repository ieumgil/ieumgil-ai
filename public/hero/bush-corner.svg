<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 140 640 340" width="640" height="340">
  <defs>
    <!-- bellflower: stem + drooping purple bell -->
    <g id="bell">
      <path d="M0 0 Q-4 -40 4 -78" stroke="#3E8E4F" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M4 -78 Q14 -84 18 -74" stroke="#3E8E4F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M8 -74 Q18 -76 28 -74 L30 -54 Q26 -50 23 -55 Q19 -49 15 -55 Q11 -50 7 -54 Z" fill="#8A6BD1"/>
      <path d="M18 -75 Q28 -76 28 -74 L30 -54 Q26 -50 23 -55 Q21 -60 18 -75 Z" fill="#7458BE"/>
      <path d="M-1 -40 Q-14 -46 -20 -36" stroke="#3E8E4F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-14 -38 Q-24 -40 -32 -37 L-33 -20 Q-29 -16 -26 -21 Q-22 -15 -19 -21 Q-15 -16 -12 -20 Z" fill="#9C80DD"/>
    </g>
    <g id="bud">
      <path d="M0 0 Q2 -22 -2 -40" stroke="#4A9C58" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="-2" cy="-45" rx="7" ry="9" fill="#F6CB45"/>
      <ellipse cx="-4" cy="-48" rx="2.5" ry="3.5" fill="#FBE38A"/>
    </g>
  <clipPath id="cut"><rect x="0" y="0" width="800" height="462"/></clipPath>
  </defs>
  <ellipse cx="450" cy="462" rx="330" ry="14" fill="#2E6B40" opacity="0.12"/>
  <g clip-path="url(#cut)">

  <!-- soft shadow under cluster -->


  <!-- back broad leaves -->
  <path d="M250 450 Q190 330 250 250 Q300 330 270 450 Z" fill="#3E9A55"/>
  <path d="M250 250 Q262 350 262 450" stroke="#2E7D45" stroke-width="3" fill="none"/>
  <path d="M640 450 Q620 300 720 230 Q730 340 665 450 Z" fill="#3E9A55"/>
  <path d="M720 230 Q680 340 655 450" stroke="#2E7D45" stroke-width="3" fill="none"/>

  <!-- back bushes (deep green) -->
  <circle cx="470" cy="300" r="120" fill="#2F8A4A"/>
  <circle cx="620" cy="330" r="105" fill="#2F8A4A"/>
  <circle cx="340" cy="345" r="95" fill="#2F8A4A"/>
  <path d="M520 205 Q560 230 575 270" stroke="#4FB066" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M680 260 Q700 280 708 305" stroke="#4FB066" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- tall flowers behind front bushes -->
  <use href="#bell" transform="translate(395 300) scale(1.3)"/>
  <use href="#bell" transform="translate(560 270) scale(1.15)"/>
  <use href="#bud" transform="translate(470 220) scale(1.1)"/>
  <use href="#bud" transform="translate(690 270)"/>

  <!-- pink tulip -->
  <g transform="translate(520 300)">
    <path d="M0 40 Q-6 -40 2 -110" stroke="#3E8E4F" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-2 20 Q-46 -10 -40 -70 Q-10 -40 -2 0 Z" fill="#4FB066"/>
    <path d="M-28 -142 Q-32 -108 -18 -96 Q2 -88 20 -96 Q34 -108 30 -142 L18 -126 L2 -146 L-14 -126 Z" fill="#F28AAE"/>
    <path d="M2 -146 L18 -126 L30 -142 Q34 -108 20 -96 Q10 -92 2 -93 Q12 -118 2 -146 Z" fill="#E56F98"/>
    <path d="M-18 -128 Q-20 -112 -12 -104" stroke="#FBC3D6" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- front bushes (bright green) -->
  <circle cx="400" cy="400" r="90" fill="#4FB066"/>
  <circle cx="560" cy="395" r="100" fill="#5CBF6E"/>
  <circle cx="710" cy="405" r="80" fill="#4FB066"/>
  <circle cx="280" cy="420" r="62" fill="#5CBF6E"/>
  <!-- flatten bottom so nothing extends past the cluster -->
  <rect x="150" y="452" width="660" height="40" fill="#FFFFFF" opacity="0"/>

  <!-- dash highlights -->
  <g stroke="#8ED89B" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M345 345 Q365 328 392 324"/>
    <path d="M355 370 L370 362"/>
    <path d="M500 330 Q525 312 556 310"/>
    <path d="M515 356 L532 348"/>
    <path d="M665 360 Q685 345 708 344"/>
    <path d="M245 395 Q258 382 276 380"/>
  </g>
  <g stroke="#3E9A55" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M430 440 L450 432"/>
    <path d="M600 438 L622 430"/>
    <path d="M730 440 L748 433"/>
  </g>

  <!-- front flowers & buds -->
  <use href="#bell" transform="translate(300 400) scale(1.0)"/>
  <use href="#bell" transform="translate(660 380) scale(1.05)"/>
  <use href="#bud" transform="translate(440 380)"/>
  <use href="#bud" transform="translate(620 370) scale(0.9)"/>
  <use href="#bud" transform="translate(250 410) scale(0.85)"/>

  <!-- front broad leaves -->
  <path d="M200 460 Q150 400 185 345 Q240 395 230 460 Z" fill="#3E9A55"/>
  <path d="M185 345 Q212 405 220 460" stroke="#2E7D45" stroke-width="3" fill="none"/>
  <path d="M770 460 Q790 390 760 340 Q725 400 745 460 Z" fill="#3E9A55"/>
  <path d="M760 340 Q750 400 757 460" stroke="#2E7D45" stroke-width="3" fill="none"/>

  </g>
</svg>
