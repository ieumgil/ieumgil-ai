<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>3단계 · 꼭 필요한 조건</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6FD0}a:hover{color:#1450A3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; font-family: 'Noto Sans KR', sans-serif; color: #191F28; letter-spacing: -0.02em; letter-spacing: -0.02em">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px">
<a href="Who.dc.html" aria-label="이전 단계로" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #F2F4F6; background: #F2F4F6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#191F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4l-6 6 6 6"></path></svg></a>
<span style="font-size: 17px; font-weight: 700; color: {{accent}}">이음길</span>
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #F2F4F6; background: #F2F4F6; font-size: 15px; color: #191F28; font-family: inherit; cursor: pointer">가 글씨 크게</button>
</div>
<div style="padding: 8px 20px 0">
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #4E5968"><span>3 / 4 단계</span><span>꼭 필요한 조건</span></div>
<div style="height: 4px; border-radius: 2px; background: #E5E8EB; margin-top: 8px"><div style="width: 75%; height: 4px; border-radius: 2px; background: {{accent}}"></div></div>
</div>
<div style="padding: 20px 20px 4px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">꼭 필요한 조건을 확인해 주세요</h1>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center">
<span style="padding: 6px 12px; border-radius: 16px; background: #EAF2FD; color: #1450A3; font-size: 14px; font-weight: 500">휠체어 이용</span>
<span style="padding: 6px 12px; border-radius: 16px; background: #EAF2FD; color: #1450A3; font-size: 14px; font-weight: 500">보행이 불편한 어르신</span>
<a href="Who.dc.html" style="font-size: 14px; padding: 6px 4px">바꾸기</a>
</div>
</div>
<div style="flex: 1; overflow-y: auto; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 8px 0 2px; font-size: 15px; font-weight: 700">꼭 필요해요 · 하나라도 안 맞으면 루트에서 빼요</p>
<sc-for list="{{must}}" as="c" hint-placeholder-count="6">
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 10px 14px; border-radius: 12px; background: #F2F4F6; cursor: pointer; border: 1.5px solid {{c.border}}">
<input type="checkbox" checked="{{c.on}}" onChange="{{c.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: {{accent}}">
<span style="flex: 1; font-size: 16px">{{c.label}}</span>
<span style="font-size: 13px; color: #4E5968; padding: 3px 8px; border-radius: 10px; background: #F2F4F6">{{c.who}}</span>
</label>
</sc-for>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 1.5; color: #4E5968">장애인 전용 주차구역은 1단계에서 '장애인 사용 자동차 표지'를 골라서 나와요.</p>
<p style="margin: 14px 0 2px; font-size: 15px; font-weight: 700">한 번에 걸을 수 있는 거리 · 어르신 기준</p>
<p style="margin: 0 0 4px; font-size: 14px; line-height: 1.5; color: #4E5968">주차장에서 입구까지, 관람 동선 길이와 비교해요</p>
<div role="radiogroup" aria-label="한 번에 걸을 수 있는 거리" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{dists}}" as="d" hint-placeholder-count="4">
<label style="position: relative; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; background: {{d.bg}}; color: {{d.fg}}; border: 1.5px solid {{d.border}}"><input type="radio" name="walk" checked="{{d.on}}" onChange="{{d.pick}}" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">{{d.label}}</label>
</sc-for>
</div>
<p style="margin: 14px 0 2px; font-size: 15px; font-weight: 700">있으면 좋아요 · 추천 순위에만 반영해요</p>
<sc-for list="{{nice}}" as="c" hint-placeholder-count="2">
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 10px 14px; border-radius: 12px; background: #F2F4F6; cursor: pointer; border: 1.5px solid {{c.border}}">
<input type="checkbox" checked="{{c.on}}" onChange="{{c.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: {{accent}}">
<span style="flex: 1; font-size: 16px">{{c.label}}</span>
<span style="font-size: 13px; color: #4E5968; padding: 3px 8px; border-radius: 10px; background: #F2F4F6">{{c.who}}</span>
</label>
</sc-for>
</div>
<div style="padding: 14px 20px 28px; background: #FFFFFF; border-top: 1px solid #F2F4F6; display: flex; gap: 10px">
<a href="Who.dc.html" style="flex: 1; height: 56px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #F2F4F6; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500; color: #191F28; text-decoration: none; background: #F2F4F6">이전</a>
<a href="Taste.dc.html" style="flex: 2; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-decoration: none; background: {{accent}}; color: #FFFFFF">다음 · 좋아하는 곳</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E6FD0","options":["#1E6FD0","#0B7A75","#1C5D79"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1E6FD0';
    const st = this.state || {};
    const off = st.off || {};
    const walk = st.walk || '300m';
    const row = (id, label, who) => {
      const on = !off[id];
      return {
        label: label, who: who, on: on,
        border: on ? accent : '#F2F4F6',
        toggle: () => {
          const next = Object.assign({}, off);
          next[id] = on;
          this.setState({ off: next });
        }
      };
    };
    const dist = (label) => {
      const on = walk === label;
      return {
        label: label, on: on,
        bg: on ? accent : '#F2F4F6',
        fg: on ? '#FFFFFF' : '#191F28',
        border: on ? accent : '#F2F4F6',
        pick: () => this.setState({ walk: label })
      };
    };
    return {
      accent: accent,
      must: [
        row('step', '계단·단차 없는 진입', '휠체어'),
        row('elev', '엘리베이터 (층이 있는 곳)', '휠체어'),
        row('slope', '급한 경사 없음', '휠체어'),
        row('surface', '포장길·데크 노면', '휠체어·어르신'),
        row('toilet', '장애인 화장실', '휠체어'),
        row('parking', '장애인 전용 주차구역', '표지 차량')
      ],
      nice: [
        row('rest', '쉴 곳 (벤치·쉼터)', '어르신'),
        row('rental', '휠체어 대여', '휠체어')
      ],
      dists: [dist('100m'), dist('300m'), dist('500m'), dist('제한 없음')]
    };
  }
}
</script>
</body>
</html>
