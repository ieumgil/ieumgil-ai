<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>4단계 · 좋아하는 곳</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6FD0}a:hover{color:#1450A3}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; font-family: 'Noto Sans KR', sans-serif; color: #191F28; letter-spacing: -0.02em; letter-spacing: -0.02em">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px">
<a href="Conditions.dc.html" aria-label="이전 단계로" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #F2F4F6; background: #F2F4F6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#191F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4l-6 6 6 6"></path></svg></a>
<span style="font-size: 17px; font-weight: 700; color: {{accent}}">이음길</span>
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #F2F4F6; background: #F2F4F6; font-size: 15px; color: #191F28; font-family: inherit; cursor: pointer">가 글씨 크게</button>
</div>
<div style="padding: 8px 20px 0">
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #4E5968"><span>4 / 4 단계</span><span>좋아하는 곳</span></div>
<div style="height: 4px; border-radius: 2px; background: #E5E8EB; margin-top: 8px"><div style="width: 100%; height: 4px; border-radius: 2px; background: {{accent}}"></div></div>
</div>
<div style="padding: 24px 20px 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.35; font-weight: 700">어떤 곳을 좋아하세요?</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.6; color: #4E5968">여러 개 골라도 돼요. 고른 곳 위주로 추천해요.</p>
</div>
<div style="padding: 16px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 96px; box-sizing: border-box; padding: 14px; border-radius: 16px; text-align: left; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; gap: 6px; background: {{c.bg}}; border: 2px solid {{c.border}}">
<span style="display: flex; align-items: center; justify-content: space-between; width: 100%"><span style="font-size: 17px; font-weight: 700; color: #191F28">{{c.label}}</span><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{c.checkBg}}; border: 2px solid {{c.checkBorder}}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></span></span>
<span style="font-size: 14px; line-height: 1.45; color: #4E5968">{{c.desc}}</span>
</button>
</sc-for>
</div>
<div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">하루에 얼마나 돌아볼까요?</h2>
<div role="radiogroup" aria-label="하루 일정 밀도" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{paces}}" as="p" hint-placeholder-count="3">
<label style="position: relative; min-height: 64px; box-sizing: border-box; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{p.bg}}; color: {{p.fg}}; border: 1.5px solid {{p.border}}"><input type="radio" name="pace" checked="{{p.on}}" onChange="{{p.pick}}" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0"><span style="font-size: 16px; font-weight: 700">{{p.label}}</span><span style="font-size: 13px">{{p.sub}}</span></label>
</sc-for>
</div>
</div>
<div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">꼭 가고 싶은 곳이 있나요? <span style="font-size: 14px; font-weight: 400; color: #4E5968">선택</span></h2>
<label style="display: flex; align-items: center; gap: 8px; height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #F2F4F6; background: #F2F4F6">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#4E5968" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"></circle><path d="M14 14l4 4"></path></svg>
<input type="text" aria-label="관광지 이름 검색" placeholder="관광지 이름으로 찾기" style="flex: 1; border: none; outline: none; font-size: 16px; font-family: inherit; background: transparent; color: #191F28">
</label>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 18px; background: #EAF2FD; color: #1450A3; font-size: 15px">[관광지 B]<button type="button" aria-label="[관광지 B] 빼기" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#1450A3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"></path></svg></button></span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4E5968">조건에 맞지 않는 곳을 고르면, 루트에 넣기 전에 어떤 점이 어려운지 먼저 알려드려요.</p>
</div>
<div style="flex-grow: 1; min-height: 24px"></div>
<div style="padding: 16px 20px 28px; background: #FFFFFF; border-top: 1px solid #F2F4F6; display: flex; gap: 10px">
<a href="Conditions.dc.html" style="flex: 1; height: 56px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #F2F4F6; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500; color: #191F28; text-decoration: none; background: #F2F4F6">이전</a>
<a href="ResultMobile.dc.html" style="flex: 2; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-decoration: none; background: {{accent}}; color: #FFFFFF">루트 만들기</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E6FD0","options":["#1E6FD0","#0B7A75","#1C5D79"]},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1E6FD0';
    const st = this.state || {};
    const picked = st.picked || { sea: true, history: true };
    const pace = st.pace || 'normal';
    const cat = (id, label, desc) => {
      const on = !!picked[id];
      return {
        label: label, desc: desc, on: on,
        bg: on ? '#EAF2FD' : '#F2F4F6',
        border: on ? accent : '#F2F4F6',
        checkBg: on ? accent : '#FFFFFF',
        checkBorder: on ? accent : '#D1D6DB',
        pick: () => { const n = Object.assign({}, picked); n[id] = !on; this.setState({ picked: n }); }
      };
    };
    const p = (id, label, sub) => {
      const on = pace === id;
      return {
        label: label, sub: sub, on: on,
        bg: on ? accent : '#F2F4F6',
        fg: on ? '#FFFFFF' : '#191F28',
        border: on ? accent : '#F2F4F6',
        pick: () => this.setState({ pace: id })
      };
    };
    return {
      accent: accent,
      cats: [
        cat('sea', '바다·해변', '해변 데크, 바다 전망'),
        cat('nature', '자연·산책', '호수, 숲길, 공원'),
        cat('history', '역사·문화', '고택, 유적, 기념관'),
        cat('museum', '전시·박물관', '실내 전시, 체험관'),
        cat('market', '시장·먹거리', '전통시장, 먹거리 거리'),
        cat('view', '전망·체험', '전망대, 케이블카')
      ],
      paces: [p('slow', '여유롭게', '하루 2~3곳'), p('normal', '보통', '하루 3~4곳'), p('busy', '많이', '하루 4~5곳')]
    };
  }
}
</script>
</body>
</html>
